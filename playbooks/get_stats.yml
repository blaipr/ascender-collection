---
# This expects you to run this on the Ascender controller itself and use a system administrator account which you attach to the Job Template
# You will also need to have localhost in your inventory for this to work without modification
- name: Get stats
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    controller_hostname: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
    controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    controller_validate_certs: "{{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') | default(false) }}"

  tasks:
    - name: Get number of JT
      ansible.builtin.uri:
        url: https://{{ controller_hostname }}/api/v2/metrics/?format=json
        method: GET
        force_basic_auth: true
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        return_content: true
        headers:
          Content-Type: application/json
        validate_certs: "{{ controller_validate_certs | bool }}"
      register: r_metrics

    # The platform renamed every metric from awx_ to ascender_ when the package
    # was renamed. Both are in the field at once: a release carrying the old
    # names, and installs tracking main with the new ones. Picking the prefix
    # off the payload means this playbook reads either without being told which,
    # and a missing key here is a failed lookup rather than a wrong number.
    - name: Determine the metric name prefix this platform uses
      ansible.builtin.set_fact:
        metric_prefix: "{{ 'ascender' if 'ascender_organizations_total' in r_metrics['json'] else 'awx' }}"


    - name: Debug metrics
      ansible.builtin.debug:
        verbosity: 1
        msg:
          - "{{ r_metrics }}"
          - "{{ r_metrics['json'][metric_prefix ~ '_system_info'] }}"
          - "{{ r_metrics['json'][metric_prefix ~ '_job_templates_total'] }}"
          - "{{ r_metrics['json'][metric_prefix ~ '_workflow_job_templates_total'] }}"

    - name: Get users info
      ansible.builtin.uri:
        url: https://{{ controller_hostname }}/api/v2/users/?format=json
        method: GET
        force_basic_auth: true
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        return_content: true
        headers:
          Content-Type: application/json
        validate_certs: "{{ controller_validate_certs | bool }}"
      register: r_users

    - name: Debug users
      ansible.builtin.debug:
        verbosity: 1
        msg:
          - "{{ r_users['json']['results'] }}"
          - "{{ ansible_facts['date_time']['date'] | to_datetime('%Y-%m-%d') }}"
          - "{{ r_users['json']['results'][0]['last_login'] | regex_search('[0-9]{4}-[0-9]{2}-[0-9]{2}', '\\0') | first }}"
          - "{{ (r_users['json']['results'][0]['last_login'] | regex_search('[0-9]{4}-[0-9]{2}-[0-9]{2}', '\\0') | first) | to_datetime('%Y-%m-%d') }}"
          - "{{ (((r_users['json']['results'][0]['last_login'] | regex_search('[0-9]{4}-[0-9]{2}-[0-9]{2}', '\\0') | first) | to_datetime('%Y-%m-%d')) - (ansible_facts['date_time']['date']
            | to_datetime('%Y-%m-%d'))).days }}"

    - name: Remove users who have never logged in (null)
      ansible.builtin.set_fact:
        temp_user_list: "{{ (temp_user_list | default([])) + [item['last_login']] }}"
      when: item['last_login'] is regex('[0-9]{4}-[0-9]{2}-[0-9]{2}(.*)')
      loop: "{{ r_users['json']['results'] }}"

    - name: Debug removing users list
      ansible.builtin.debug:
        verbosity: 1
        msg:
          - "{{ temp_user_list | default([]) }}"

    - name: Find active users
      vars:
        item_date: "{{ (item | regex_search('[0-9]{4}-[0-9]{2}-[0-9]{2}', '\\0') | first) | to_datetime('%Y-%m-%d') }}"
      ansible.builtin.set_fact:
        active_users: "{{ (active_users | default([])) + [item] }}"
      when: (((ansible_facts['date_time']['date'] | to_datetime('%Y-%m-%d')) - item_date).days) <= 30
      loop: "{{ temp_user_list | default([]) }}"

    - name: Output
      ansible.builtin.debug:
        msg:
          - "Number of active users: {{ active_users | default([]) | length }}"
          - "Number of orgs: {{ r_metrics['json'][metric_prefix ~ '_organizations_total']['samples'][0]['value'] }}"
          - "Number of users: {{ r_metrics['json'][metric_prefix ~ '_users_total']['samples'][0]['value'] }}"
          - "Number of teams: {{ r_metrics['json'][metric_prefix ~ '_teams_total']['samples'][0]['value'] }}"
          - "Number of inv: {{ r_metrics['json'][metric_prefix ~ '_inventories_total']['samples'][0]['value'] }}"
          - "Number of projects: {{ r_metrics['json'][metric_prefix ~ '_projects_total']['samples'][0]['value'] }}"
          - "Number of JT: {{ r_metrics['json'][metric_prefix ~ '_job_templates_total']['samples'][0]['value'] }}"
          - "Number of workflows: {{ r_metrics['json'][metric_prefix ~ '_workflow_job_templates_total']['samples'][0]['value'] }}"
          - "Number of hosts: {{ r_metrics['json'][metric_prefix ~ '_hosts_total']['samples'] }}"
          - "{{ r_metrics['json'][metric_prefix ~ '_status_total']['samples'] }}"
          - "{{ r_metrics['json'][metric_prefix ~ '_system_info']['samples'][0]['labels'] }}"

...
