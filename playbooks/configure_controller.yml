---
- name: Playbook to configure ansible controller post installation
  hosts: localhost
  connection: local
  # Nothing here reads a fact. The roles talk to the controller API over the
  # network, so gathering costs a setup run on localhost for no reader.
  gather_facts: false
  tasks:
    - name: Include vars from configs directory
      ansible.builtin.include_vars:
        dir: "{{ controller_configs_dir | default((lookup('env', 'CONTROLLER_CONFIGS_DIR') == '') | ternary('./configs', lookup('env', 'CONTROLLER_CONFIGS_DIR')))
          }}"
        ignore_files: [controller_config.yml.template]
        extensions: [yml]
      tags:
        - always

    - name: Call dispatch role
      ansible.builtin.include_role:
        name: ctrliq.ascender.dispatch
...
