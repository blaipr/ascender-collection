bugfixes:
  - groups, instance_groups, instances, inventories roles - Preserved explicitly empty membership lists.
    ``hosts``, ``instances``, ``policy_instance_list``, ``peers``, ``instance_groups`` and
    ``input_inventories`` were converted to ``omit`` by a ``default(..., true)`` that treats an empty list
    as unset, so there was no way to empty one from role data. An empty list now clears; omitting the key
    still leaves the membership unchanged.
