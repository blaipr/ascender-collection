minor_changes:
  - workflow_job_templates role - Renamed the role's four tuning variables to follow the convention every
    other role uses, keyed on the role name - ``controller_configuration_workflow_job_templates_secure_logging``,
    ``_async_retries``, ``_async_delay`` and ``_loop_delay``. The old names,
    ``workflow_job_templates_secure_logging``, ``controller_configuration_workflow_async_retries``,
    ``controller_configuration_workflow_async_delay`` and ``controller_configuration_workflow__loop_delay``
    (two underscores), still work - each new default falls back to the old name before its global.
