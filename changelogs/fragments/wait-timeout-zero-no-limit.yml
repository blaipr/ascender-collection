bugfixes:
  - >-
    project, project_update, job_launch, job_wait, ad_hoc_command, ad_hoc_command_wait, inventory_source_update,
    workflow_launch, bulk_job_launch, workflow_node_wait, workflow_approval - A ``timeout`` of 0 waits without a
    limit again, as the ``project`` module documents and as the collection did before 25.5.0, instead of aborting
    on the first poll. The ``projects`` role sends a literal 0 whenever a project sets ``timeout`` or
    ``job_timeout`` or ``controller_configuration_projects_enforce_defaults`` is on, so every such project failed
    with "aborted due to timeout" a fraction of a second into an update that then succeeded on the controller.
    This supersedes the 25.5.0 entry "honor an explicit ``timeout=0`` by aborting immediately instead of waiting
    forever": a wait whose budget is zero aborts before its first poll can return, so it could never succeed.
    Leaving ``timeout`` unset and setting it to 0 both mean no limit, and a positive value is unaffected.
  - >-
    controller_api module utils - The timeout message now says how long the wait was, which field it was
    waiting on and the object's last status, for example ``aborted due to timeout (waited 0.2s for
    event_processing_finished, last status: running)``, so the next one can be read off the log.
