bugfixes:
  - credential_input_source - Removing a credential input source no longer fails when its target
    credential is already gone. ``resolve_name_to_id`` failed the task outright, so a teardown that
    deleted the credential before its input sources could not complete. With ``state=absent`` a missing
    target credential now exits unchanged; with ``state=present`` it still fails, because an input source
    cannot be created against a credential that does not exist.
